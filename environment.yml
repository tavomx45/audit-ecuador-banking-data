name: morosidad-bancos-ecuador

channels:
  - conda-forge

dependencies:
  # Python
  - python=3.12

  # Procesamiento de datos
  - numpy=2.5.3
  - pandas=3.0.6
  - pyarrow=25.0.0

  # Lectura de archivos Excel
  - openpyxl=3.1.5
